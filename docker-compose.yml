# Knots behind Caddy, which gets and renews the HTTPS certificate by itself.
#   cp .env.example .env   (fill it in, including DOMAIN=your-hostname)
#   docker compose up -d --build
services:
  knots:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      KNOTS_HOST: 0.0.0.0
      KNOTS_ALLOWED_HOSTS: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - knots-data:/data
    expose:
      - "8000"           # reachable by Caddy only, never published to the internet

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"          # certificate issuance and the redirect to https
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - knots

volumes:
  knots-data:
  caddy-data:
  caddy-config:
