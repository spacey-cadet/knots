:root{
  --ink:#0A0F2C; --night:#0E2A8A; --knot:#1D4FE0; --glow:#5CE1FF; --sky:#D6E6FF; --paper:#FFFFFF;
  --sun:#FFD84A; --mint:#8CF0B7; --coral:#FF7A8C; --mute:#4A5483;
  --line:3px solid var(--ink); --shadow:6px 6px 0 var(--ink); --shadow-s:3px 3px 0 var(--ink);
  --sans:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Martian Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:12px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sky);color:var(--ink);font:400 16px/1.5 var(--sans);font-optical-sizing:auto;
  background-image:radial-gradient(var(--ink) 1px,transparent 1.4px);background-size:22px 22px;background-position:0 0;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;background:var(--sky);opacity:.9;z-index:-1}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--sun);outline-offset:2px;box-shadow:0 0 0 7px var(--ink)}
a{color:var(--knot);font-weight:600}

/* ---------- header ---------- */
header.top{background:var(--night);color:#fff;border-bottom:var(--line);padding:22px 28px;display:flex;flex-wrap:wrap;gap:18px 32px;align-items:center}
.brand{display:flex;align-items:center;gap:14px}
.brand svg{width:64px;height:64px;flex:none}
.brand h1{margin:0;font-size:clamp(34px,5vw,52px);line-height:1;font-weight:800;letter-spacing:-.03em}
.brand h1 span{color:var(--glow)}
.tag{margin:6px 0 0;max-width:46ch;color:#CFE0FF;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto;justify-content:flex-end;max-width:640px}
.chip{background:var(--paper);color:var(--ink);border:var(--line);border-radius:999px;padding:3px 12px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow-s);white-space:nowrap}
.chip b{font-weight:800}
.chip.warn{background:var(--sun)}
.pass{display:none;gap:8px;align-items:center;width:100%;background:var(--sun);color:var(--ink);border:var(--line);border-radius:var(--r);padding:10px 14px;box-shadow:var(--shadow-s)}
.pass.on{display:flex;flex-wrap:wrap}
.pass input{flex:1;min-width:160px;border:var(--line);border-radius:8px;padding:6px 10px;background:#fff}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:292px minmax(0,1fr);gap:28px;max-width:1500px;margin:0 auto;padding:28px}
nav.tools{align-self:start;position:sticky;top:20px}
nav.tools h2{margin:22px 0 10px;font-size:15px;font-weight:800;letter-spacing:0}
nav.tools h2:first-child{margin-top:0}
.tool{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--paper);border:var(--line);border-radius:var(--r);padding:10px 12px;margin:0 0 12px;
  cursor:pointer;box-shadow:var(--shadow-s);transition:transform .08s,box-shadow .08s;font-weight:700;font-size:15.5px}
.tool:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.tool[aria-current="true"]{background:var(--knot);color:#fff;box-shadow:var(--shadow);transform:translate(-2px,-2px)}
.badge{display:inline-block;border:2.5px solid var(--ink);border-radius:8px;padding:0 8px;font-size:13px;font-weight:800;line-height:1.5;color:var(--ink);flex:none}
.badge.read{background:var(--glow)} .badge.write{background:var(--mint)} .badge.delete{background:var(--coral)}

.card{background:var(--paper);border:var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.op{padding:22px 24px;margin-bottom:28px}
.op h2{margin:0;font-size:clamp(26px,3.4vw,40px);line-height:1.1;font-weight:800;letter-spacing:-.025em;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.op .wire{margin:8px 0 14px;font:600 13px/1.4 var(--mono);color:var(--mute)}
.op .desc p{margin:0 0 10px;max-width:74ch}
.op details summary{cursor:pointer;font-weight:700;color:var(--knot);width:max-content}

.io{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:34px;align-items:start;position:relative}
.panel{display:flex;flex-direction:column;min-height:300px}
.panel>header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:var(--line);border-radius:9px 9px 0 0}
.panel.in>header{background:var(--knot);color:#fff}
.panel.out>header{background:var(--glow)}
.panel>header h3{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em;margin-right:auto}
.panel .body{padding:16px}
.tie{position:absolute;left:calc(5 / 11 * (100% - 34px) + 17px);top:16px;transform:translateX(-50%);width:44px;height:44px;z-index:2;
  background:var(--sun);border:var(--line);border-radius:50%;display:grid;place-items:center;box-shadow:var(--shadow-s)}
.tie svg{width:24px;height:24px}
.tie.spin svg{animation:tie .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes tie{from{transform:rotate(-300deg) scale(.6)}to{transform:none}}

.tabs{display:flex;gap:6px}
.tab{background:var(--paper);color:var(--ink);border:2.5px solid var(--ink);border-radius:8px;padding:2px 12px;font-weight:700;font-size:14px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:#fff}

/* ---------- form ---------- */
.preset{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.preset label{font-weight:700}
select,input[type=text],input[type=number],textarea{border:var(--line);border-radius:8px;background:#fff;padding:7px 10px;width:100%}
select{width:auto;max-width:100%;font-weight:600;background:var(--sun);cursor:pointer}
textarea{font:500 13.5px/1.55 var(--mono);resize:vertical;min-height:84px}
.field{margin-bottom:16px}
.field .name{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px}
.field .name b{font:800 14px var(--mono)}
.field .type{font-size:13px;color:var(--mute);font-weight:600}
.field .req{font-size:13px;font-weight:800;background:var(--coral);border:2px solid var(--ink);border-radius:6px;padding:0 6px}
.field .hint{margin:4px 0 0;color:var(--mute);font-size:14px}
.toggle{display:inline-flex;gap:10px;align-items:center;cursor:pointer;font-weight:700}
.toggle input{appearance:none;width:52px;height:28px;border:var(--line);border-radius:999px;background:#fff;position:relative;cursor:pointer;margin:0;transition:background .12s}
.toggle input::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:var(--ink);transition:transform .12s}
.toggle input:checked{background:var(--mint)}
.toggle input:checked::after{transform:translateX(24px)}
.note-id{background:var(--sky);border:2.5px dashed var(--ink);border-radius:10px;padding:8px 12px;font-size:14px;margin-bottom:14px}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--sun);color:var(--ink);border:var(--line);border-radius:var(--r);padding:10px 22px;font-weight:800;font-size:18px;cursor:pointer;box-shadow:var(--shadow);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:7px 7px 0 var(--ink)}
.btn:active{transform:translate(5px,5px);box-shadow:1px 1px 0 var(--ink)}
.btn[disabled]{background:#E9ECF5;color:var(--mute);cursor:progress;transform:none;box-shadow:var(--shadow-s)}
.btn.small{font-size:14.5px;padding:4px 12px;box-shadow:var(--shadow-s);border-radius:9px}
.btn.small:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.white{background:#fff}
.err{background:var(--coral);border:var(--line);border-radius:10px;padding:10px 14px;font-weight:600;margin-top:12px}

/* ---------- output ---------- */
.status{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.empty{border:3px dashed var(--ink);border-radius:var(--r);padding:26px 20px;text-align:left;background:var(--sky)}
.empty b{font-size:20px;display:block;margin-bottom:4px}
.say{position:relative;background:var(--glow);border:var(--line);border-radius:22px 22px 22px 4px;padding:14px 16px;margin:0 0 20px;box-shadow:var(--shadow-s)}
.say .who{font-weight:800;margin-bottom:2px}
.say p{margin:0;font-size:17px;line-height:1.45}
.say .btn{margin-top:10px}
.sect{margin:22px 0 10px;font-size:20px;font-weight:800;letter-spacing:-.015em}
.theme{background:var(--sky);border:var(--line);border-radius:10px;padding:10px 14px;margin-bottom:10px}
.theme b{display:block;font-size:17px}
.theme q{display:block;margin-top:4px;font-style:normal;quotes:none}
code{font:600 .86em var(--mono);background:var(--sky);border:2px solid var(--ink);border-radius:6px;padding:0 5px}
mark{background:var(--glow);color:var(--ink);padding:1px 4px;border:2px solid var(--ink);border-radius:5px;font-weight:600;box-decoration-break:clone}
.pick{border:var(--line);border-radius:var(--r);margin-bottom:18px;box-shadow:var(--shadow-s);background:#fff;overflow:hidden}
.pick .stripe{padding:6px 14px;border-bottom:var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:700}
.pick .stripe.film{background:var(--knot);color:#fff} .pick .stripe.paper{background:var(--mint)} .pick .stripe.video{background:var(--sun)}
.pick .stripe .grow{margin-left:auto}
.pick .main{padding:12px 14px}
.pick h4{margin:0 0 6px;font-size:22px;line-height:1.15;font-weight:800;letter-spacing:-.02em}
.pick .note{margin:0 0 10px;font-size:16.5px;max-width:62ch}
.conf{background:#fff;color:var(--ink);border:2.5px solid var(--ink);border-radius:999px;padding:0 10px;font-size:13.5px;font-weight:800}
.facts{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.fact{background:var(--sky);border:2px solid var(--ink);border-radius:7px;padding:0 8px;font-size:13.5px;font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.spoken{margin:8px 0 0;padding:8px 12px;border-left:6px solid var(--knot);background:var(--sky);font-size:15px}
.rated{font-weight:700;font-size:14.5px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:8px 0;font-size:15px}
.kv dt{font-weight:800} .kv dd{margin:0}

/* ---------- json ---------- */
.json{background:#0B1236;color:#E8EEFF;border:var(--line);border-radius:10px;padding:14px 16px;font:500 13px/1.6 var(--mono);overflow:auto;max-height:640px;white-space:pre-wrap;word-break:break-word}
.json details{margin-left:16px}
.json summary{cursor:pointer;list-style:none;margin-left:-16px}
.json summary::-webkit-details-marker{display:none}
.json summary::before{content:"▸";display:inline-block;width:16px;color:var(--glow)}
.json details[open]>summary::before{content:"▾"}
.json .k{color:var(--glow)} .json .s{color:#9BF3C0} .json .n{color:var(--sun)} .json .b{color:#FF9DB0} .json .z{color:#9AA7D6} .json .dim{color:#7F8BB8}
.json .leaf{margin-left:16px;display:block}
.copy{margin-left:auto}
pre.code{margin:0 0 12px}

footer.note{max-width:1500px;margin:0 auto;padding:0 28px 40px;color:var(--mute);font-size:14.5px}

@media (max-width:1100px){
  .io{grid-template-columns:1fr;gap:40px}
  .tie{left:50%;top:calc(50% - 22px);display:none}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr;padding:18px 16px;gap:20px}
  nav.tools{position:static;display:flex;gap:10px;overflow-x:auto;padding:0 4px 12px 0;margin:0 -4px}
  nav.tools h2{display:none}
  .tool{width:auto;flex:none;margin:0 6px 4px 0;white-space:nowrap}
  header.top{padding:18px 16px}
  .chips{margin-left:0;justify-content:flex-start}
  .op{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<body>
<header class="top">
  <div class="brand">
    <svg id="logo" viewBox="-80 -80 160 160" aria-hidden="true"></svg>
    <div>
      <h1>Knots <span>Explorer</span></h1>

  </div>
  <div class="chips" id="chips" aria-label="How this server is set up"></div>
  <div class="pass" id="pass" role="group" aria-label="Passcode">
    <label for="passcode"><b>Passcode</b></label>
    <input id="passcode" type="text" autocomplete="off" spellcheck="false" placeholder="Ask the person who shared this link">
    <button class="btn small white" id="passgo" type="button">Unlock</button>
  </div>
</header>

<main class="app">
  <nav class="tools" id="nav" aria-label="Tools"></nav>
  <section id="main" aria-live="polite"><div class="card op"><h2>Loading tools</h2></div></section>
</main>
<footer class="note">Every run goes through the same MCP server Alexa+ uses. Knots remembers interests only, never your words, and your visitor id stays in this browser.</footer>

<script>
"use strict";
const PRESETS = [{"name": "Memecoins and FOMO", "turns": ["Alexa, what's a memecoin and why do people buy them?", "Can you explain memecoin tokenomics, like liquidity pools and market cap?", "I keep seeing memecoin threads on my Reddit feed, is this all just a bubble?", "Tell me more about the research behind speculative crypto assets."], "topics": ["memecoins", "speculation"]}, {"name": "Free will", "turns": ["Alexa, is free will an illusion?", "What did that neuroscience experiment say about decisions being made before we're aware of them?", "If everything is determined, how can anyone be held responsible for what they do?", "I've been reading about compatibilism, explain it simply."], "topics": ["free will", "determinism"]}, {"name": "Housing prices", "turns": ["Why are housing prices so high in big cities?", "Is it zoning or is it investors?", "What did Tokyo do differently?"], "topics": ["housing", "zoning"]}, {"name": "Lonely online", "turns": ["Why do I feel more lonely the more time I spend online?", "Is there research on social media and mental health?", "My feed is mostly strangers arguing. Why does outrage spread faster than anything else?", "What happened to the idea that the internet would bring people together?"], "topics": ["loneliness", "social media"]}, {"name": "Sleep", "turns": ["Why is sleep so important and what happens if you skip it?", "Is the 8 hour rule real?", "Does catching up on weekends work?"], "topics": ["sleep"]}, {"name": "Vague and curious", "turns": ["Alexa, what's the weather like later?", "Play something relaxing. Also what time is it in Tokyo?", "I've been kind of curious lately, not sure about what though.", "Maybe something with time travel? Or not."], "topics": ["time travel"]}];
const HINTS = {
  session_texts: "What the person said, one message per line. Alexa turns and Reddit text both work.",
  include_videos: "Also search YouTube for explainers. Off by default: YouTube allows only about 100 searches a day for the whole server.",
  challenge_me: "Reserve one pick that complicates the person's own view.",
  explain: "Show the evidence behind each pick: the sentence you said, matched tags, the item's own summary. Off by default because the note is what a person should read.",
  limit: "How many cards to return.",
  topics: "Plain topic words, one per line. Searches TMDB, arXiv and YouTube.",
  session_id: "The id returned by knots_partner. Run that tool first.",
  url: "The link of a pick that was shown in that session.",
  good: "On for a good pick, off for one that missed.",
  conversations: "Earlier conversations as JSON: [{\"turns\": [\"…\"], \"timestamp\": \"2026-10-01\"}]. Optional."
};
const SAMPLE_OF = {session_texts: true, topics: true};

const state = {tools: [], current: null, status: null, passcode: sessionStorage.getItem("knots_pass") || "",

/* ---------- tiny DOM helper (everything from the server goes through textContent) ---------- */
function h(tag, attrs, ...kids) {

const safeUrl = u => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : null; } catch { return null; } };
const pretty = o => JSON.stringify(o, null, 2);

/* ---------- logo: a trefoil, drawn twice (ink outline, then colour) with three over-passes ---------- */
(function logo() {

    p.setAttribute("stroke", c); p.setAttribute("stroke-width", w); p.setAttribute("stroke-linecap", "round"); p.setAttribute("stroke-linejoin", "round"); svg.append(p); };

/* ---------- api ---------- */
async function api(path, opts = {}) {

async function boot() {

  try {
    const [t, s] = await Promise.all([api("/explore/api/tools"), api("/explore/api/status")]);
    if (t.status === 404) { document.getElementById("main").replaceChildren(h("div", {class: "card op"}, h("h2", {text: "The explorer is switched off"}), h("p", {text: "Set KNOTS_EXPLORER=on on the server to turn it on."}))); return; }

}

function drawChips() {
  const s = state.status, c = document.getElementById("chips");
  const chip = (label, value, warn) => h("span", {class: "chip" + (warn ? " warn" : "")}, label + " ", h("b", {text: value}));
  c.replaceChildren(
    chip("Reads you with", s.extractor === "bedrock" ? "Claude on Bedrock" : "offline heuristic", s.extractor !== "bedrock"),
    chip("Ranks with", s.ranker),
    chip("Quality floor", s.floor ? `similarity ≥ ${s.floor.similarity}` : "off", !s.floor),
    chip("Notes", s.notes),
    chip("Memory", s.remembers_visitors ? "per visitor" : "off", !s.remembers_visitors),
    s.offline_mock_catalogs ? chip("Catalogs", "mock data", true) : null);
}

function drawNav() {
  const nav = document.getElementById("nav"); nav.replaceChildren();
  const groups = {}; state.tools.forEach(t => (groups[t.group] = groups[t.group] || []).push(t));
  for (const g of ["Understand", "Recommend", "Remember", "Other"]) if (groups[g]) {
    nav.append(h("h2", {text: g}));
    groups[g].forEach(t => nav.append(h("button", {class: "tool", type: "button", "data-tool": t.name, onclick: () => select(t)},
      h("span", {class: "badge " + t.kind, text: t.kind}), t.name)));
  }
}

/* ---------- tool page ---------- */
function inline(text) { return text.split("`").map((s, i) => i % 2 ? h("code", {text: s}) : s); }
function paragraphs(text) { return text.split(/\n\s*\n/).map(p => p.replace(/\s*\n\s*/g, " ").trim()).filter(Boolean); }

function select(tool) {
  state.current = tool; state.mode = "form"; state.outTab = "cards";
  document.querySelectorAll(".tool").forEach(b => b.setAttribute("aria-current", String(b.dataset.tool === tool.name)));

  const main = document.getElementById("main");
  main.replaceChildren(
    h("div", {class: "card op"},
      h("h2", {}, h("span", {class: "badge " + tool.kind, text: tool.kind}), tool.name),
      h("p", {class: "wire", text: `tools/call  ·  ${tool.name}`}), desc),
    h("div", {class: "io"},
      h("div", {class: "tie", id: "tie", "aria-hidden": "true"}),
      h("section", {class: "card panel in", "aria-label": "Input"}, h("header", {id: "inhead"}), h("div", {class: "body", id: "inbody"})),

}

function props(tool) { return Object.entries((tool.inputSchema || {}).properties || {}).filter(([k]) => k !== "user_id"); }
function typeOf(schema) {
  const any = schema.anyOf ? schema.anyOf.find(x => x.type !== "null") || schema.anyOf[0] : schema;
  return {t: any.type, items: any.items, min: any.minimum, max: any.maximum, enum: any.enum};

function drawIn() {
  const tool = state.current, head = document.getElementById("inhead"), body = document.getElementById("inbody");
  head.replaceChildren(h("h3", {text: "In"}),
    h("div", {class: "tabs", role: "tablist"}, ["form", "json"].map(m => h("button", {class: "tab", role: "tab", type: "button", "aria-selected": String(state.mode === m),
      onclick: () => switchMode(m), text: m === "form" ? "Form" : "JSON"}))));

  if (!ps.length) body.append(h("p", {text: "This tool takes no input."}));
  if (tool.inputSchema && tool.inputSchema.properties && tool.inputSchema.properties.user_id)

    body.append(h("textarea", {id: "rawjson", rows: 12, spellcheck: "false", "aria-label": "Arguments as JSON"}));
    document.getElementById("rawjson").value = pretty(state.pending || collect());
  } else {
    if (ps.some(([k]) => SAMPLE_OF[k]) && PRESETS.length) {

        h("option", {value: "", text: "Pick a sample"}), PRESETS.map((p, i) => h("option", {value: i, text: p.name})));

}

function fieldFor(name, schema, required) {
  const ty = typeOf(schema), id = "f_" + name, wrap = h("div", {class: "field", "data-name": name});

    if (name === "url" && state.lastPartner) {
      wrap.append(h("datalist", {id: "urls"}, (state.lastPartner.response?.picks || []).map(p => h("option", {value: p.url, text: p.title}))));

  if (HINTS[name]) wrap.append(h("p", {class: "hint", text: HINTS[name]}));

}

function collect() {
  const out = {};
  for (const [name, schema] of props(state.current)) {
    const el = document.getElementById("f_" + name); if (!el) continue;
    const kind = el.dataset.kind, v = el.value;
    if (kind === "bool") out[name] = el.checked;
    else if (kind === "num") { if (v !== "") out[name] = Number(v); }
    else if (kind === "lines") { const l = v.split("\n").map(s => s.trim()).filter(Boolean); if (l.length) out[name] = l; }
    else if (kind === "json") { if (v.trim()) { try { out[name] = JSON.parse(v); } catch { throw new Error(`${name} is not valid JSON.`); } } }
    else if (v.trim()) out[name] = v.trim();

}
function applyArgs(a) {
  for (const [name] of props(state.current)) {
    const el = document.getElementById("f_" + name); if (!el || !(name in a)) continue;
    const v = a[name], kind = el.dataset.kind;
    if (kind === "bool") el.checked = !!v; else if (kind === "lines") el.value = [].concat(v).join("\n");

function switchMode(m) {

    state.mode = m; drawIn();
  } catch (e) { document.getElementById("inerr").replaceChildren(h("div", {class: "err", text: e.message})); }

function loadPreset(i) {
  if (i === "") return; const p = PRESETS[i], name = props(state.current).some(([k]) => k === "session_texts") ? "session_texts" : "topics";
  const el = document.getElementById("f_" + name); if (el) el.value = (name === "topics" ? p.topics : p.turns).join("\n");

/* ---------- run ---------- */
async function run() {
  if (state.running) return; const tool = state.current, btn = document.getElementById("run"), errBox = document.getElementById("inerr");
  errBox.replaceChildren();
  let args; try { args = state.mode === "json" ? JSON.parse(document.getElementById("rawjson").value || "{}") : collect(); }
  catch (e) { errBox.append(h("div", {class: "err", text: e.message})); return; }
  state.running = true; btn.disabled = true; btn.textContent = "Running…";
  document.getElementById("outbody").replaceChildren(h("p", {text: tool.name === "knots_partner" ? "Reading the conversation, searching the catalogs, ranking, writing notes…" : "Working…"}));
  try {
    const r = await api("/explore/api/call", {method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify({tool: tool.name, arguments: args})});
    state.last[tool.name] = {...r.body, http: r.status, args};
    if (tool.name === "knots_partner" && r.body.ok) state.lastPartner = r.body.result;
    state.outTab = r.body.ok && hasCards(tool.name, r.body.result) ? "cards" : (r.body.ok ? "json" : "json");
  } catch (e) { state.last[tool.name] = {ok: false, error: e.message, http: 0, args}; }
  state.running = false; btn.disabled = false; btn.textContent = "Run tool";
  drawOut(); const tie = document.getElementById("tie"); tie.classList.remove("spin"); void tie.offsetWidth; tie.classList.add("spin");
}

/* ---------- output ---------- */
function hasCards(name, r) { return r && typeof r === "object" && ((name === "knots_partner" && r.response) || (name === "get_recommendations" && Array.isArray(r.cards)) ||
  (name === "extract_interests" && Array.isArray(r.interests)) || (name === "search_content" && Array.isArray(r)) || (name === "what_do_you_remember" && Array.isArray(r.threads))); }

function drawOut() {
  const tool = state.current, res = state.last[tool.name], head = document.getElementById("outhead"), body = document.getElementById("outbody");
  head.replaceChildren(h("h3", {text: "Out"}));
  if (!res) { body.replaceChildren(h("div", {class: "empty"}, h("b", {text: "Nothing yet"}), h("span", {text: "Fill in the input and press Run tool. The answer appears here as cards, raw JSON and the MCP request."}))); return; }
  const tabs = [["cards", "Cards"], ["json", "JSON"], ["mcp", "MCP request"]].filter(t => t[0] !== "cards" || (res.ok && hasCards(tool.name, res.result)));
  head.append(h("div", {class: "tabs", role: "tablist"}, tabs.map(([k, t]) => h("button", {class: "tab", role: "tab", type: "button", "aria-selected": String(state.outTab === k), onclick: () => { state.outTab = k; drawOut(); }, text: t}))));
  const status = h("div", {class: "status"},
    h("span", {class: "chip"}, res.ok ? "ok" : "failed"), res.ms != null ? h("span", {class: "chip"}, `${(res.ms / 1000).toFixed(res.ms < 1000 ? 2 : 1)} s`) : null,
    res.remembered_as ? h("span", {class: "chip"}, "acting as ", h("b", {text: res.remembered_as === "visitor" ? "your visitor id" : "nobody (no memory)"})) : null);
  body.replaceChildren(status);
  if (!res.ok) body.append(h("div", {class: "err", text: res.error || "The call failed."}));
  if (state.outTab === "cards" && res.ok) body.append(renderCards(tool.name, res.result));
  else if (state.outTab === "mcp") body.append(renderRequest(res));
  else if (res.ok) body.append(jsonBlock(res.result));
}

function jsonBlock(value) {
  const box = h("div", {class: "json", tabindex: "0", role: "region", "aria-label": "Response JSON"});
  const scalar = v => v === null ? h("span", {class: "z", text: "null"}) : typeof v === "string" ? h("span", {class: "s", text: JSON.stringify(v)})
    : typeof v === "number" ? h("span", {class: "n", text: String(v)}) : h("span", {class: "b", text: String(v)});
  function node(v, key, last, depth) {
    const keyEl = key == null ? [] : [h("span", {class: "k", text: JSON.stringify(key)}), ": "];
    if (v && typeof v === "object") {
      const arr = Array.isArray(v), ents = arr ? v.map((x, i) => [i, x]) : Object.entries(v), o = arr ? "[" : "{", c = arr ? "]" : "}";
      if (!ents.length) return h("span", {class: "leaf"}, keyEl, o + c, last ? "" : ",");
      const d = h("details", depth < 3 ? {open: true} : {}, h("summary", {}, keyEl, o, h("span", {class: "dim", text: ` ${ents.length} ${arr ? "items" : "keys"} `})));
      ents.forEach(([k, x], i) => d.append(node(x, arr ? null : k, i === ents.length - 1, depth + 1)));
      d.append(h("span", {class: "leaf"}, c + (last ? "" : ",")));
      return d;
    }
    return h("span", {class: "leaf"}, keyEl, scalar(v), last ? "" : ",");
  }
  box.append(node(value, null, true, 0));
  return h("div", {}, h("div", {class: "row", style: "margin:0 0 10px"}, h("button", {class: "btn small white copy", type: "button", onclick: e => copy(pretty(value), e.target)}, "Copy JSON")), box);
}
function copy(text, el) { (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(() => { const o = el.textContent; el.textContent = "Copied"; setTimeout(() => el.textContent = o, 1200); }).catch(() => {}); }

function renderRequest(res) {
  const body = pretty(res.request), cmd = `curl -s -X POST ${location.origin}/mcp \\\n  -H "Authorization: Bearer $TOKEN" \\\n  -H "Content-Type: application/json" \\\n  -H "Accept: application/json, text/event-stream" \\\n  -d '${JSON.stringify(res.request)}'`;
  return h("div", {}, h("p", {text: "This is the JSON-RPC message an MCP client sends. The explorer sends it for you, as your visitor."}),
    h("div", {class: "json"}, body), h("p", {class: "sect", text: "The same call from a terminal"}), h("div", {class: "json", text: cmd}),
    h("div", {class: "row"}, h("button", {class: "btn small white", type: "button", onclick: e => copy(cmd, e.target)}, "Copy curl")));
}

/* ---------- cards ---------- */
function say(text, sub) {
  if (!text) return null;
  return h("div", {class: "say"}, h("div", {class: "who", text: "Alexa would say"}), h("p", {text}),
    "speechSynthesis" in window ? h("button", {class: "btn small white", type: "button", onclick: () => { speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance(text)); }}, "Hear it") : null);
}
function quoted(text, quote) {
  const i = quote ? text.toLowerCase().indexOf(quote.toLowerCase()) : -1; if (i < 0) return [text];
  return [text.slice(0, i), h("mark", {text: text.slice(i, i + quote.length)}), text.slice(i + quote.length)];
}
function themeBlock(t) { return h("div", {class: "theme"}, h("b", {text: t.theme}), t.evidence ? h("q", {}, "You said: “", h("mark", {text: t.evidence}), "”") : null); }
const RECEIPT_LABEL = {you_said: "You said", tags: "Matched tags", summary: "Its own summary", status: "Status", citations: "Citations"};
function evidence(p, ledger) {
  const rows = (ledger.receipts || []).map(r => [RECEIPT_LABEL[r.kind] || r.kind, r.text]);
  if (p.matched_topic) rows.unshift(["Matched topic", p.matched_topic]);
  if (ledger.fit_score != null) rows.push(["Fit score", String(ledger.fit_score)]);
  if (ledger.sim != null) rows.push(["Similarity to what you said", String(ledger.sim)]);
  if (!rows.length) return null;
  return h("details", {}, h("summary", {text: "Evidence behind this pick"}),
    h("dl", {class: "kv"}, rows.map(([k, v]) => [h("dt", {text: k}), h("dd", {text: v})])));
}
const STRIPE = {movie: "film", series: "film", doc: "film", paper: "paper", video: "video"};
const LABEL = {movie: "Film", series: "Series", doc: "Documentary", paper: "Paper", video: "Video"};

function pickCard(p, sessionId, ledger) {
  const type = p.type || "movie", href = safeUrl(p.url), spoken = p.spoken_note && p.spoken_note !== p.note ? p.spoken_note : "";
  const rated = h("span", {class: "rated"});
  const rate = good => async e => {
    e.target.disabled = true; rated.textContent = "Saving…";
    try { const r = await api("/explore/api/call", {method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify({tool: "rate_pick", arguments: {session_id: sessionId, url: p.url, good}})});
      const out = r.body.result || {}; rated.textContent = r.body.ok ? (out.recorded === false ? (out.reason || "Not recorded.") : (good ? "Saved as a good pick. Future picks learn from it." : "Saved as a miss. Future picks learn from it.")) : (r.body.error || "Could not save.");
    } catch (er) { rated.textContent = er.message; } e.target.disabled = false; };
  return h("article", {class: "pick"},
    h("div", {class: "stripe " + (STRIPE[type] || "film")}, LABEL[type] || type, p.year ? `· ${p.year}` : "", h("span", {class: "conf grow", text: p.confidence || ""})),
    h("div", {class: "main"}, h("h4", {text: p.title}), h("p", {class: "note", text: p.note || ""}),
      spoken ? h("details", {}, h("summary", {text: "What Alexa says out loud"}), h("p", {class: "spoken", text: spoken})) : null,
      (p.facts || []).length ? h("div", {class: "facts"}, p.facts.map(f => h("span", {class: "fact", title: "Source: " + f.source, text: `${f.label}: ${f.value}`}))) : null,
      ledger ? evidence(p, ledger) : null,
      h("div", {class: "row"}, href ? h("a", {href, target: "_blank", rel: "noopener noreferrer", text: "Open it"}) : null,
        sessionId ? [h("button", {class: "btn small white", type: "button", onclick: rate(true)}, "Good pick"), h("button", {class: "btn small white", type: "button", onclick: rate(false)}, "Missed"), rated] : null)));
}

const put = (box, ...kids) => box.append(...kids.flat().filter(k => k != null && k !== false));

function renderCards(name, r) {
  const box = h("div", {});
  if (name === "knots_partner") {
    const resp = r.response, f = state.status.floor, explained = !!(state.last[name] && state.last[name].args && state.last[name].args.explain);
    const ledger = {}; Object.values(r.picks || {}).flat().forEach(c => { if (c && c.url && (c.receipts || c.fit_score != null)) ledger[c.url] = c; });
    put(box, say(resp.say));
    if (resp.status === "empty") put(box, h("div", {class: "empty"}, h("b", {text: "Nothing cleared the quality bar"}),
      h("span", {text: f ? `Knots hides any pick whose similarity to what was said is under ${f.similarity}, and shows fewer picks instead of padding the list. ` : "Nothing came back from the catalogs. "}), resp.ask || ""));
    if ((resp.themes || []).length) put(box, h("h3", {class: "sect", text: "What it heard underneath"}), resp.themes.map(themeBlock));
    if ((resp.picks || []).length) put(box, h("h3", {class: "sect", text: `${resp.picks.length} ${resp.picks.length === 1 ? "pick" : "picks"}${resp.status === "relaxed" ? ", looser than usual" : ""}`}), resp.picks.map(p => pickCard(p, r.session_id, explained ? (ledger[p.url] || {}) : null)));
    if ((r.pairs || []).length) put(box, h("h3", {class: "sect", text: "Double features"}), r.pairs.map(p => h("div", {class: "theme"}, h("b", {text: `${p.watch?.title} then ${p.learn?.title}`}), p.bridge ? h("span", {text: p.bridge}) : null)));
    if (resp.ask && resp.status !== "empty") put(box, h("h3", {class: "sect", text: "It asks back"}), h("div", {class: "say", style: "border-radius:22px 22px 4px 22px;background:var(--sun)"}, h("p", {text: resp.ask})));
    if (r.memory) put(box, h("h3", {class: "sect", text: "Memory"}), h("dl", {class: "kv"}, h("dt", {text: "Recalled"}), h("dd", {text: `${r.memory.recalled} earlier ${r.memory.recalled === 1 ? "topic" : "topics"}`}), h("dt", {text: "Stored now"}), h("dd", {text: `${r.memory.stored_new} new ${r.memory.stored_new === 1 ? "conversation" : "conversations"}`})));
  } else if (name === "get_recommendations") {
    put(box, h("p", {text: `Extractor: ${r.extractor}. ${r.cards.length} ranked ${r.cards.length === 1 ? "card" : "cards"}.`}));
    r.cards.forEach(c => put(box, pickCard({title: c.title, type: c.type, year: c.year, url: c.url, note: c.note || c.reasoning, spoken_note: c.spoken_note, matched_topic: c.matched_topic,
      confidence: c.confidence != null ? Math.round(c.confidence * 100) + "% likely good" : "", facts: []}, null, c.receipts || c.fit_score != null ? c : null)));
    if (!r.cards.length) put(box, h("div", {class: "empty"}, h("b", {text: "No cards"}), "Nothing cleared the quality bar for this input."));
  } else if (name === "extract_interests") {
    put(box, h("p", {text: `Read by: ${r.extractor}`}));
    r.interests.forEach(i => put(box, h("div", {class: "theme"}, h("b", {text: i.topic}),
      h("dl", {class: "kv"}, h("dt", {text: "Concepts"}), h("dd", {text: (i.concepts || []).join(", ") || "none"}), h("dt", {text: "Underneath"}), h("dd", {text: (i.implicit_themes || []).join("; ") || "nothing it could back with a quote"}),
        h("dt", {text: "Best formats"}), h("dd", {text: (i.mediums || []).join(", ")}), h("dt", {text: "Keywords"}), h("dd", {text: (i.keywords || []).slice(0, 8).join(", ")})),
      (i.implicit_themes || []).map(t => i.theme_evidence && i.theme_evidence[t] ? h("q", {style: "display:block;quotes:none"}, "“", h("mark", {text: i.theme_evidence[t]}), "”") : null))));
  } else if (name === "search_content") {
    r.forEach(it => put(box, pickCard({title: it.title, type: it.content_type, year: it.year, url: it.source_url, note: it.blurb || it.abstract, matched_topic: it.topic, facts: it.rating ? [{label: "rating", value: it.rating + "/10", source: "TMDB"}] : []}, null)));
  } else if (name === "what_do_you_remember") {
    put(box, h("p", {text: `${r.remembered_conversations} remembered ${r.remembered_conversations === 1 ? "conversation" : "conversations"}. ${r.stores || ""}`}));
    (r.threads || []).forEach(t => put(box, h("div", {class: "theme"}, h("b", {text: t.topic}), `${t.conversations} ${t.conversations === 1 ? "conversation" : "conversations"}`)));
    if (r.note) put(box, h("div", {class: "empty"}, r.note));
  }
  return box;
}
boot();
</script>
